<!doctype html>
<html lang="en">
  <head>
    <script>
      (function() {
        var theme = localStorage.getItem('fretlearn_theme');
        if (theme !== 'tweed' && theme !== 'tolex') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'tolex' : 'tweed';
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#c8a46a" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1714" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>FretLearn | A Free Fretboard Trainer</title>
    <meta name="description" content="Learn every note on the guitar or bass neck. FretLearn listens to what you play and scores every answer. Free and open source." />
    <!-- Open Graph / Social Media Meta -->
    <meta property="og:title" content="FretLearn | A Free Fretboard Trainer" />
    <meta property="og:description" content="Learn every note on the guitar or bass neck. FretLearn listens to what you play and scores every answer. Free and open source." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://fretlearn.app" />
  </head>
  <body class="antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
